<script type="text/javascript" template-section="onIncludeEditPrepare">
{   
    let node = this;

    // create the faultEditor.
    let faultSample = normalizeIndentation(`
        return 
            message.errorCode && 
            message.errorCode >= 400;
    `);

    faultScriptLangunage.then(language => {
        node.faultEditor = monaco.editor.create(document.getElementById('node-input-faultFunction-editor'), {
            value: (node.faultFunction === undefined) ? faultSample :node.faultFunction,
            language: language.getName(),
            automaticLayout: true,
            wordBasedSuggestions: "currentDocument",
        });
    })

    // create the faultEditor.
    let tripSample = normalizeIndentation(`
        /** @type {number[]} */
        let buffer = breaker.context().get("buffer", []);
        let interval = 10*1000;     // 10 seconds.
        let capacity = 5;           // maximum number of failures.
        let time = new Date().getTime();
        buffer.push(time);
        buffer = buffer.filter(item => item + interval >= time);
        breaker.context().set("buffer", buffer);
        return (buffer.length >= capacity);
    `);

    tripScriptLanguage.then(language => {
        node.tripEditor = monaco.editor.create(document.getElementById('node-input-tripFunction-editor'), {
            value: (node.tripFunction === undefined) ? tripSample :node.tripFunction,
            language: language.getName(),
            automaticLayout: true,
            wordBasedSuggestions: "currentDocument",
        });
    })

    function normalizeIndentation(code) {
        const lines = code.split('\n');
        
        // Filter out empty lines for finding minimum indent
        const nonEmptyLines = lines.filter(line => line.trim().length > 0);
        
        if (nonEmptyLines.length === 0) return code;
        
        // Find the minimum indentation level
        const minIndent = Math.min(
            ...nonEmptyLines.map(line => line.match(/^\s*/)[0].length)
        );
        
        // Remove that amount of indentation from all lines
        return lines.map(line => line.slice(minIndent)).join('\n');
    }
}
</script>
